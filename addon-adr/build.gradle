plugins{
    id 'distribution'
}

ext.addonName = "ActionDurationReminder"
ext.addonId = 1536
ext.addonCompatible = "12.1.0"
ext.esoApiToken = project.property('com.esoui.apiToken')
ext.esoPtsDir = project.property('ESO_PTS_ADDONS_DIR')
ext.esoLiveDir = project.property('ESO_LIVE_ADDONS_DIR')


file('changelog').withReader('utf8'){reader->
    def m = reader.readLine() =~ /(\d+)(\.\w+)+/
    if(m){
        def ver = m[0][0]
        ext.addonVersion = ver
        ext.apiVersion = m[0][1].toInteger() // major version: documented APIs stay stable within one apiVersion
        ver = ver.replaceAll('a','.1').replaceAll('b','.2').replaceAll('c','.3')
        def verNo = m[0][1].padLeft(2,'0')
        def mm = ver=~ /\.(\w+)/
            verNo += mm[0][1].padLeft(3,'0')
            verNo += mm.size() ==2? mm[1][1] :''
        ext.addonVersionNumber = verNo.padRight(6,'0')
    }else{
        ext.addonVersion = 'SNAPSHOT'
        ext.addonVersionNumber = '000000'
        ext.apiVersion = 0
    }
}

CopySpec mainContents = copySpec {
    filteringCharset = 'iso8859-1'
    from (addonName){
        exclude '**/*.dds'
         filter{
            it.replaceAll('@@ADDON_VERSION@@',addonVersion).replaceAll('@@ADDON_VERSION_NO@@',addonVersionNumber).replaceAll('@@API_VERSION@@',String.valueOf(apiVersion))
        }
    }
    from (addonName){
        include '**/*.dds'
    }
}

// ===== embedded/ : guarded core sources for other addons to copy in =====
def embedModuleFiles = ['Utils.lua', 'Settings.lua', 'Models.lua', 'Core.lua', 'Debug.lua']
def embedGuardLine = 'if _G.ADR_EMBED_SKIP then return end'
def embedOutputDir = new File(buildDir, 'embedded')
def embedI18nFiles = fileTree(dir: "${addonName}/i18n", include: '*.lua')
def embedStagingFiles = files(
    file("embed/EmbedAdr.lua"),
    file("embed/EMBED.md"),
    file('docs/API.md')
)

task buildEmbedded {
    group = 'distribution'
    description = 'Assemble embedded/ - guarded ADR core sources for other addons to embed'
    inputs.files embedModuleFiles.collect { "${addonName}/src/${it}" }
    inputs.files embedI18nFiles
    inputs.files embedStagingFiles
    inputs.property 'addonVersion', addonVersion
    inputs.property 'addonVersionNumber', addonVersionNumber
    inputs.property 'apiVersion', apiVersion
    outputs.dir embedOutputDir
    doLast {
        def replaceTokens = { String text ->
            text
                .replaceAll('@@ADDON_VERSION@@', addonVersion)
                .replaceAll('@@ADDON_VERSION_NO@@', addonVersionNumber)
                .replaceAll('@@API_VERSION@@', String.valueOf(apiVersion))
        }
        // iso8859-1 keeps non-ASCII bytes untouched, same as mainContents
        def writeFile = { File dst, String text ->
            dst.parentFile.mkdirs()
            dst.withWriter('iso8859-1') { it.write(text) }
        }
        embedOutputDir.mkdirs()
        embedModuleFiles.each { name ->
            def src = new File(projectDir, "${addonName}/src/${name}")
            writeFile(new File(embedOutputDir, name), embedGuardLine + '\n' + replaceTokens(src.getText('iso8859-1')))
        }
        embedI18nFiles.each { f ->
            writeFile(new File(embedOutputDir, "i18n/${f.name}"), embedGuardLine + '\n' + replaceTokens(f.getText('iso8859-1')))
        }
        // bootstrap + docs: token replacement only, no guard line
        writeFile(new File(embedOutputDir, 'EmbedAdr.lua'), replaceTokens(new File(projectDir, "embed/EmbedAdr.lua").getText('iso8859-1')))
        writeFile(new File(embedOutputDir, 'EMBED.md'), replaceTokens(new File(projectDir, "embed/EMBED.md").getText('iso8859-1')))
        writeFile(new File(embedOutputDir, 'API.md'), file('docs/API.md').getText('iso8859-1'))
    }
}

CopySpec embedContents = copySpec {
    from embedOutputDir
    into "embedded"
}

distTar.enabled = false
distributions {
    main {
        distributionBaseName  = addonName
        contents {
        	with mainContents
        	with embedContents
        }
    }
}

distZip{
    archiveFile.set(file("${buildDir}/distributions/${addonName}-${addonVersion}.zip"))
    dependsOn buildEmbedded
}
installDist.dependsOn buildEmbedded

if (hasProperty('ESO_PTS_ADDONS_DIR')){
    def installDir =  new File(esoPtsDir, addonName)
    task installToPTS(type:Sync){
    	group='distribution'
    	description='Installs the project into PTS dir'
    	with mainContents
    	with embedContents
        dependsOn buildEmbedded
        into installDir
    }
}

if (hasProperty('ESO_LIVE_ADDONS_DIR')){
    def installDir =  new File(esoLiveDir, addonName)
    task installToLive(type:Sync){
    	group='distribution'
    	description='Installs the project into LIVE dir'
    	with mainContents
    	with embedContents
        dependsOn buildEmbedded
        into installDir
    }
}

task updateChangelog {
    group = "distribution"
    description = "update changelog on esoui.com (without uploading zip)"
    doLast{
        def changelogPath = file('changelog').absolutePath
        def cmd = ['curl',
            // '--proxy', 'http://localhost:7897',  // 代理 (已禁用)
            '-H', "\"x-api-token: ${esoApiToken}\"",
            '-F', "id=${addonId}",
            '-F', "version=$addonVersion",
            '-F', "changelog=<${changelogPath}",
            'https://api.esoui.com/addons/update']
        def proc = cmd.execute()
        proc.consumeProcessOutput(System.out, System.err)
        proc.waitFor()
    }
}

task upload {
    group = "distribution"
    description = "upload addon zip file to esoui.com"
    dependsOn distZip
    doLast{
        // NOTE: never inline the changelog into -F "changelog=...": curl treats ';' in a
        // -F value as an option separator (type=/filename=...), silently truncating the
        // text at the first semicolon. "<file" reads the value verbatim from the file.
        def changelogFile = file('changelog')
        def cmd = ['curl',
            // '--proxy', 'http://localhost:7897',  // 代理 (已禁用)
            '-H', "x-api-token: ${esoApiToken}",
            '-F', "id=${addonId}",
            '-F', "version=$addonVersion",
            '-F', "compatible=$addonCompatible",
            '-F', "changelog=<${changelogFile.absolutePath}",
            '-F', "updatefile=@${distZip.archiveFile.get().asFile.absolutePath}",
            //'--resolve', 'api.esoui.com:443:104.25.180.72',
            'https://api.esoui.com/addons/update']
        // print cmd.join(' ')
        def proc = cmd.execute()
        proc.consumeProcessOutput(System.out, System.err)
        proc.waitFor()
        if (proc.exitValue() != 0) {
            throw new GradleException("curl exited with code ${proc.exitValue()}")
        }
    }
}

task addonInfo{
    group = "help"
    description = "show addon info"
    doLast{
        def proc = ['curl',
            '-H', "\"x-api-token: ${project.property('com.esoui.apiToken')}\"",
            "https://api.esoui.com/addons/details/${addonId}.json"]
                   .execute()
        proc.consumeProcessOutput(System.out, System.err)
        proc.waitFor()
    }
}


